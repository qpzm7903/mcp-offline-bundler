# Example manifest: browser MCP offline bundle.
#
# Bundles two stdio MCP servers that drive a Chrome instance over the
# Chrome DevTools Protocol (CDP). The bundle does NOT include Chrome and
# does NOT download Playwright browsers; you point the servers at a Chrome
# you start yourself (see README.md "Start Chrome remote debugging").
#
# Versions MUST be exact (no latest / * / ^ / ~ / >=). The versions below
# were pinned with `npm view <package> version` on 2026-05-29.
bundle:
  name: browser-mcp-offline-bundle
  target: linux-x64
  node: ">=20"
  archiveName: mcp-offline-bundle-linux-x64

install:
  packageManager: npm
  omitDev: true
  env:
    # Never download browsers as part of the bundle build.
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  # Post-install patch for an upstream chrome-devtools-mcp/puppeteer-core bug:
  # getWSEndpoint() trusts the webSocketDebuggerUrl from /json/version, which
  # behind a proxy / port-forward (or with WSL2 host IPs) omits or mismatches
  # the host:port, so --browserUrl connects but every operation hangs. Rewrite
  # the WebSocket URL's host:port to the endpoint the user actually provided.
  patches:
    - package: chrome-devtools-mcp
      file: build/src/third_party/index.js
      count: 1
      find: "return data.webSocketDebuggerUrl;"
      replace: "{ try { const __u = new URL(browserURL), __w = new URL(data.webSocketDebuggerUrl); __w.host = __u.host; return __w.toString(); } catch { return data.webSocketDebuggerUrl; } }"

servers:
  - name: chrome-devtools
    package: chrome-devtools-mcp
    version: "1.1.1"
    bin: chrome-devtools-mcp
    transport: stdio
    # chrome-devtools-mcp 1.x uses camelCase flags (--browserUrl, not
    # --browser-url). Usage statistics are disabled via the env var below.
    args:
      - "--browserUrl=http://127.0.0.1:9222"
      - "--no-performanceCrux"
    env:
      CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS: "1"
      CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: "1"
    smokeTestArgs:
      - "--help"

  - name: playwright
    package: "@playwright/mcp"
    version: "0.0.75"
    bin: playwright-mcp
    transport: stdio
    args:
      - "--cdp-endpoint=http://127.0.0.1:9222"
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    smokeTestArgs:
      - "--help"

clients:
  claudeDesktop: true
  codex: true
  cursor: true
  genericJson: true
